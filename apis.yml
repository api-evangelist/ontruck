aid: ontruck
name: Ontruck
description: >-
  Ontruck is a Spanish road-freight technology platform that connects shippers
  (cargadores) with a network of professional carriers (transportistas) for
  full-truckload and less-than-truckload pallet, package, and parcel transport
  across Spain, France, and wider Europe. Shippers get instant AI-driven
  pricing, automated carrier assignment, real-time traceability, and digital
  documentation through service tiers (Economy, Flex, Express); carriers get
  access to freight loads with dynamic pricing and 24/7 support. Ontruck also
  packages its stack as "Ontruck AI Tech" — an AI pricing engine, AI routing
  engine, a predictive incident system, and a forecast/capacity planner —
  offered as transport-management software. The company operates a marketing and
  customer web surface plus an in-product shipper/carrier application; it
  publishes no public developer/API portal, OpenAPI, or SDKs at this time.
